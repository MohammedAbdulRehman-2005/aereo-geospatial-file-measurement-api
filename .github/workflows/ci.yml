name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: aereo_geo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system geospatial dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with Mypy
        run: |
          mypy app

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/aereo_geo_test
        run: |
          alembic upgrade head

      - name: Run Tests with Coverage (SQLite In-Memory)
        env:
          DATABASE_URL: sqlite:///:memory:
          AI_ENABLED: "false"
        run: |
          python -m pytest --cov=app --cov-report=xml --cov-report=term -v --tb=short

      - name: Run Integration Tests (PostgreSQL Database)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/aereo_geo_test
          AI_ENABLED: "false"
        run: |
          python -m pytest tests/integration/test_api.py -v --tb=short
